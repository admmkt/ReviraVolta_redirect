<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revira Volta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg-top: #0f0f12;
    --bg-bottom: #1a1a22;
    --card-bg: #1c1c24;
    --text: #f5f5f7;
    --subtext: #a3a3ad;
    --btn-bg: #7b0000;
    --btn-text: #ffffff;
    --accent: #6c5ce7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--accent);
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .avatar-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 700;
    background: var(--accent);
    color: var(--btn-text);
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 16px 0 4px;
  }
  .bio {
    font-size: 14px;
    color: var(--subtext);
    margin: 0 0 24px;
    line-height: 1.5;
  }
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .link-btn {
    display: block;
    width: 100%;
    padding: 16px 20px;
    border-radius: 14px;
    background: var(--card-bg);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    border: 1px solid rgba(128,128,128,0.18);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .link-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(0,0,0,0.18);
    background: var(--btn-bg);
    color: var(--btn-text);
  }
  .socials {
    display: flex;
    gap: 18px;
    margin-top: 28px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .social-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--card-bg);
    color: var(--text);
    text-decoration: none;
    font-size: 18px;
    border: 1px solid rgba(128,128,128,0.18);
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .social-icon:hover {
    transform: translateY(-2px) scale(1.05);
    background: var(--accent);
    color: var(--btn-text);
  }
  footer {
    margin-top: 40px;
    font-size: 12px;
    color: var(--subtext);
    opacity: 0.7;
  }
</style>
</head>
